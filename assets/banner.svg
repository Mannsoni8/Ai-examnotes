<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Animated Mesh Gradient 1 -->
    <radialGradient id="glow-1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Mesh Gradient 2 -->
    <radialGradient id="glow-2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Mesh Gradient 3 -->
    <radialGradient id="glow-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c7d2fe" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.8" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.6; }
        50% { transform: scale(1.15) translate(-20px, 10px); opacity: 0.9; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmer {
        0% { stop-color: #ffffff; }
        50% { stop-color: #a5b4fc; }
        100% { stop-color: #ffffff; }
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .g1 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: center; }
      .g2 { animation: pulseGlow 10s ease-in-out infinite alternate-reverse; transform-origin: center; }
      .floating { animation: floatSlow 4s ease-in-out infinite; }
      .s1 { animation: sparkle 3s ease-in-out infinite; }
      .s2 { animation: sparkle 4s ease-in-out infinite 1.5s; }
      .s3 { animation: sparkle 2.5s ease-in-out infinite 0.7s; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'Fira Code', 'Courier New', Courier, monospace; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="24" fill="url(#bg-grad)" />

  <!-- Ambient Glow Bubbles -->
  <circle class="g1" cx="250" cy="100" r="280" fill="url(#glow-1)" />
  <circle class="g2" cx="950" cy="220" r="300" fill="url(#glow-2)" />
  <circle class="g1" cx="600" cy="160" r="240" fill="url(#glow-3)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.04">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
  </g>

  <!-- Border Card Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Sparkles -->
  <g fill="#c7d2fe">
    <path class="s1" d="M 180,60 L 183,72 L 195,75 L 183,78 L 180,90 L 177,78 L 165,75 L 177,72 Z" />
    <path class="s2" d="M 1020,80 L 1022,88 L 1030,90 L 1022,92 L 1020,100 L 1018,92 L 1010,90 L 1018,88 Z" />
    <path class="s3" d="M 920,240 L 923,250 L 933,253 L 923,256 L 920,266 L 917,256 L 907,253 L 917,250 Z" />
    <path class="s1" d="M 280,250 L 282,256 L 288,258 L 282,260 L 280,266 L 278,260 L 272,258 L 278,256 Z" />
  </g>

  <!-- Main Content Group -->
  <g class="floating">
    <!-- Top Pill Tag -->
    <g transform="translate(475, 38)">
      <rect width="250" height="32" rx="16" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="18" cy="16" r="5" fill="#38bdf8" />
      <text x="32" y="21" fill="#e0e7ff" class="font-sans" font-size="12" font-weight="600" letter-spacing="1">NEXT-GEN AI STUDY PLATFORM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="135" text-anchor="middle" class="font-sans" font-weight="900" font-size="64" fill="url(#title-grad)" letter-spacing="-1.5">
      ExamNotes <tspan fill="#38bdf8">AI</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="175" text-anchor="middle" class="font-sans" font-weight="400" font-size="18" fill="#94a3b8" letter-spacing="0.5">
      Instant High-Yield Revision Notes • Visual Flowcharts • Export Clean PDFs
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(260, 215)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="200" height="42" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1" />
        <text x="20" y="26" fill="#38bdf8" class="font-sans" font-size="16">💎</text>
        <text x="48" y="26" fill="#f8fafc" class="font-sans" font-size="13" font-weight="600">50 Free AI Credits</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(235, 0)">
        <rect width="210" height="42" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1" />
        <text x="20" y="26" fill="#a855f7" class="font-sans" font-size="16">📝</text>
        <text x="48" y="26" fill="#f8fafc" class="font-sans" font-size="13" font-weight="600">Exam-Oriented Notes</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(480, 0)">
        <rect width="200" height="42" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1" />
        <text x="20" y="26" fill="#34d399" class="font-sans" font-size="16">⚡</text>
        <text x="48" y="26" fill="#f8fafc" class="font-sans" font-size="13" font-weight="600">Instant PDF Vector</text>
      </g>
    </g>
  </g>
</svg>
